                } else {
                    console.log("there are cards")
                    this.saveCards()

                }
            },
            newCard: function(slug, scene, color="lightblue") {
                // create an ID for the card
                const date = new Date()
                const card_id = `${date.getDay()}${date.getHours()}${date.getSeconds()}${date.getMilliseconds()}`
                // set the card data
                let card = {
                    "slug": slug.toUpperCase(), 
                    "scene": scene, 
                    "id": card_id, 
                    "color": color,
                    "x": 20,  
                    "y": 20 
                }
                // add it to the library
                CardLibrary[card.id] = card
                //save the cards to local storage
                this.saveCards()
                return card

                let keys = Object.keys(CardLibrary)
                const container = $("#container")
                for (let i=0;i<keys.length; i++) {
